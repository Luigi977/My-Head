<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cronômetro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Fraunces:ital,opsz@1,9..144&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Cronômetro</p>

    <div class="watch-row">
      <div class="watch">
        <svg class="watch__ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="watch__ring-track" cx="100" cy="100" r="92"></circle>
          <circle class="watch__ring-sweep" id="ringSweep" cx="100" cy="100" r="92"></circle>
        </svg>
        <div class="watch__face">
          <span class="watch__time" id="time">00:00<small>.00</small></span>
          <span class="watch__status" id="status">Parado</span>
        </div>
      </div>
      <div class="heads" id="heads" aria-hidden="true"></div>
    </div>

    <div class="controls">
      <button class="btn btn--ghost" id="reset">Zerar</button>
      <button class="btn btn--primary" id="startPause">Iniciar</button>
      <button class="btn" id="lap" disabled>Marcar volta</button>
    </div>

    <ol class="laps" id="laps">
      <li class="laps__empty" id="lapsEmpty">Suas voltas aparecem aqui.</li>
    </ol>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
